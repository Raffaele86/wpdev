<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>wpdev</title>
<style>
  @font-face {
    font-family: 'Space Mono';
    src: url('fonts/SpaceMono-Regular.ttf') format('truetype');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Space Mono';
    src: url('fonts/SpaceMono-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal; font-display: swap;
  }

  :root {
    --bg:        #17140f;
    --surface:   #1f1b14;
    --surface-2: #2a241a;
    --console:   #100d09;
    --line:      #3a3226;
    --ink:       #f2ecd9;
    --muted:     #a89a7e;
    --amber:     #f2a950;
    --amber-2:   #ffc272;
    --live:      #7fd6a2;
    --warn:      #e0b341;
    --danger:    #e8746a;

    --amber-tint: rgba(242,169,80,.12);
    --amber-line: rgba(242,169,80,.40);
    --live-tint:  rgba(127,214,162,.11);
    --live-line:  rgba(127,214,162,.38);
    --danger-tint: rgba(232,116,106,.12);

    --font-display: 'Space Mono', ui-monospace, 'Cascadia Code', 'DejaVu Sans Mono', monospace;
    --font-data: ui-monospace, 'Cascadia Code', 'SFMono-Regular', 'DejaVu Sans Mono', monospace;
    --font-prose: ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font: 13px/1.55 var(--font-prose);
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--amber); color: #1a1305; }
  a { color: var(--amber); text-decoration: none; cursor: pointer; }
  a:hover { color: var(--amber-2); text-decoration: underline; text-underline-offset: 2px; }
  code { font: 12px var(--font-data); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 3px; }

  /* ---------------------------------------------------------- top bar --- */
  #topbar {
    display: flex; align-items: center; gap: 20px;
    padding: 0 16px; height: 52px; flex: none;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand-led {
    align-self: center; width: 9px; height: 9px; border-radius: 50%;
    background: var(--amber); box-shadow: 0 0 8px -1px var(--amber), 0 0 3px var(--amber);
  }
  .brand-word { font: 700 17px var(--font-display); letter-spacing: .01em; }
  .brand-sub {
    font: 10px var(--font-display); letter-spacing: .28em; text-transform: uppercase;
    color: var(--muted);
  }
  .fleet-readout {
    margin-right: auto; font: 12px var(--font-data); color: var(--muted);
    letter-spacing: .02em; display: flex; align-items: center; gap: 8px;
  }
  .fleet-readout .fx-label { text-transform: uppercase; letter-spacing: .18em; font: 10px var(--font-display); }
  .fleet-readout .up { color: var(--live); }
  .fleet-readout .down { color: var(--muted); }
  .fleet-readout .down.bad { color: var(--danger); }
  .fleet-readout .dot { color: var(--line); }
  .top-actions { display: flex; gap: 8px; }

  /* --------------------------------------------------------- body row --- */
  #bodyRow { display: flex; flex: 1; min-height: 0; }

  /* rail */
  #rail {
    width: 244px; min-width: 244px; flex: none;
    background: var(--surface); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .rail-head {
    padding: 14px 16px 8px; font: 10px var(--font-display);
    letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
  }
  #siteList { flex: 1; overflow-y: auto; padding: 2px 8px 8px; }
  .site-row {
    position: relative; display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 8px 13px; border-radius: 4px; cursor: pointer;
    color: var(--ink);
  }
  .site-row::before {
    content: ''; position: absolute; left: 3px; top: 50%; transform: translateY(-50%);
    width: 2px; height: 0; background: var(--amber); border-radius: 2px;
    transition: height .12s ease;
  }
  .site-row:hover { background: var(--surface-2); }
  .site-row.sel { background: var(--surface-2); }
  .site-row.sel::before { height: 58%; }
  .site-row .slug { font: 13px var(--font-display); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site-row .row-tag {
    font: 9px var(--font-display); letter-spacing: .1em; text-transform: uppercase;
    color: var(--amber); border: 1px solid var(--amber-line); border-radius: 3px;
    padding: 1px 5px; flex: none;
  }
  #newBtn { margin: 8px 12px 12px; }

  /* LED */
  .led { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); }
  .led.on  { background: var(--live); box-shadow: 0 0 7px -1px var(--live); }
  .led.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
  .led.err { background: var(--amber); box-shadow: 0 0 7px -1px var(--amber); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .32; } }

  /* --------------------------------------------------------- detail --- */
  #detail { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #detailHead { display: none; padding: 16px 22px 12px; border-bottom: 1px solid var(--line); }
  #detailHead.show { display: block; }
  .dh-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .dh-slug { font: 700 21px var(--font-display); letter-spacing: .005em; margin-right: auto; }
  .dh-actions { display: flex; gap: 7px; flex-wrap: wrap; }

  /* status pill */
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    font: 11px var(--font-display); letter-spacing: .03em;
    padding: 5px 10px 5px 9px; border-radius: 4px; border: 1px solid var(--line);
    color: var(--muted); white-space: nowrap;
  }
  .pill.on  { color: var(--live);  background: var(--live-tint);  border-color: var(--live-line); }
  .pill.err { color: var(--amber); background: var(--amber-tint); border-color: var(--amber-line); }

  /* tabs */
  #tabs { display: flex; gap: 0; padding: 0 22px; border-bottom: 1px solid var(--line); flex: none; }
  #tabs:empty { display: none; }
  .tab {
    font: 12px var(--font-display); letter-spacing: .02em; color: var(--muted);
    padding: 11px 0; margin-right: 22px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink); }
  .tab.sel { color: var(--amber); border-bottom-color: var(--amber); }

  #content { flex: 1; overflow-y: auto; padding: 22px; min-height: 0; }

  /* ------------------------------------------------------ spec sheet --- */
  .spec { max-width: 720px; }
  .spec-row {
    display: grid; grid-template-columns: 104px 1fr auto; gap: 16px;
    align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .spec-row .k {
    font: 10px var(--font-display); letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); padding-top: 2px;
  }
  .spec-row .v { font: 13px var(--font-data); color: var(--ink); word-break: break-all; line-height: 1.5; }
  .spec-row .v .dim { color: var(--muted); }
  .icon-btn {
    font: 13px var(--font-data); background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 2px 4px; border-radius: 3px; align-self: start;
  }
  .icon-btn:hover { color: var(--amber); background: var(--amber-tint); }

  .section-label {
    font: 10px var(--font-display); letter-spacing: .2em; text-transform: uppercase;
    color: var(--muted); margin: 26px 0 12px;
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; max-width: 720px; }

  /* ------------------------------------------------- fleet overview --- */
  .fleet-hero { margin-bottom: 22px; }
  .fleet-hero .eyebrow {
    font: 10px var(--font-display); letter-spacing: .24em; text-transform: uppercase;
    color: var(--amber);
  }
  .fleet-hero h1 { font: 400 24px var(--font-display); margin: 6px 0 4px; letter-spacing: .01em; }
  .fleet-hero h1 b { font-weight: 700; color: var(--amber); }
  .fleet-hero p { color: var(--muted); font: 13px var(--font-prose); }

  .fleet-board {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(252px, 1fr)); gap: 12px;
  }
  .fleet-card {
    border: 1px solid var(--line); border-radius: 5px; background: var(--surface);
    padding: 13px 14px; display: flex; flex-direction: column; gap: 10px; cursor: pointer;
    transition: border-color .12s ease;
  }
  .fleet-card:hover { border-color: var(--amber-line); }
  .fc-head { display: flex; align-items: center; gap: 9px; }
  .fc-head .slug { font: 14px var(--font-display); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fc-head .state { font: 10px var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
  .fc-head .state.on { color: var(--live); } .fc-head .state.off { color: var(--muted); } .fc-head .state.err { color: var(--amber); }
  .fc-meta { font: 11px var(--font-data); color: var(--muted); word-break: break-all; line-height: 1.5; }
  .fc-meta .live-tag { color: var(--amber); }
  .fc-actions { display: flex; gap: 7px; margin-top: 2px; }

  /* ------------------------------------------------------- buttons --- */
  button {
    font: 12px var(--font-display); letter-spacing: .02em;
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 7px 13px; cursor: pointer;
  }
  button:not(:disabled):hover { border-color: var(--amber); color: var(--amber); }
  button.primary { background: var(--amber); border-color: var(--amber); color: #1a1305; font-weight: 700; }
  button.primary:not(:disabled):hover { background: var(--amber-2); border-color: var(--amber-2); color: #1a1305; }
  button.ghost { background: transparent; }
  button.danger { background: transparent; color: var(--danger); border-color: var(--danger-tint); }
  button.danger:not(:disabled):hover { background: var(--danger-tint); border-color: var(--danger); color: var(--danger); }
  button.sm { padding: 5px 10px; font-size: 11px; }
  button:disabled { opacity: .4; cursor: default; }

  /* ------------------------------------------------------- console --- */
  #console {
    height: 158px; flex: none; display: none;
    border-top: 1px solid var(--line); background: var(--console);
    font: 12px/1.65 var(--font-data); color: var(--ink);
    overflow-y: auto; padding: 10px 16px; white-space: pre-wrap;
  }
  #console.show { display: block; }

  /* logs */
  pre.log {
    background: var(--console); border: 1px solid var(--line); border-radius: 5px;
    padding: 11px 13px; font: 11.5px/1.55 var(--font-data); color: var(--ink);
    overflow: auto; max-height: 300px; margin-bottom: 16px;
  }
  .log-name { font: 11px var(--font-display); letter-spacing: .04em; color: var(--amber); margin: 4px 0 7px; }

  iframe#mailpit {
    width: 100%; height: calc(100vh - 230px); min-height: 320px;
    border: 1px solid var(--line); border-radius: 5px; background: #fff;
  }

  .empty { color: var(--muted); padding: 64px 20px; text-align: center; font: 13px var(--font-prose); }
  .prose { color: var(--muted); max-width: 560px; margin-bottom: 14px; }

  /* --------------------------------------------------------- dialog --- */
  dialog {
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 24px; width: 440px; max-width: calc(100vw - 32px);
  }
  dialog::backdrop { background: rgba(10,8,5,.62); }
  .dlg-title { font: 700 16px var(--font-display); letter-spacing: .01em; margin-bottom: 4px; }
  dialog label {
    display: block; margin: 15px 0 5px; color: var(--muted);
    font: 10px var(--font-display); letter-spacing: .12em; text-transform: uppercase;
  }
  dialog label .hint { text-transform: none; letter-spacing: 0; color: var(--muted); font-family: var(--font-data); }
  dialog input, dialog select {
    width: 100%; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px; padding: 9px 11px;
    font: 13px var(--font-data);
  }
  dialog input:focus, dialog select:focus { outline: none; border-color: var(--amber); }
  dialog input::placeholder { color: var(--muted); }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }

  /* --------------------------------------------------------- toast --- */
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--surface-2); border: 1px solid var(--amber-line); color: var(--ink);
    padding: 10px 18px; border-radius: 5px; font: 12px var(--font-data);
    opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* -------------------------------------------------------- responsive --- */
  @media (max-width: 720px) {
    #rail { width: 176px; min-width: 176px; }
    .brand-sub { display: none; }
    #content, #detailHead { padding-left: 16px; padding-right: 16px; }
    #tabs { padding: 0 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div id="topbar">
    <div class="brand">
      <span class="brand-led"></span>
      <span class="brand-word">wpdev</span>
      <span class="brand-sub">console</span>
    </div>
    <div id="fleetReadout" class="fleet-readout"></div>
    <div class="top-actions">
      <button id="mailpitBtn" class="ghost">mailpit</button>
    </div>
  </div>

  <div id="bodyRow">
    <aside id="rail">
      <div class="rail-head">Flotta</div>
      <div id="siteList"></div>
      <button id="newBtn" class="primary">＋ nuovo sito</button>
    </aside>
    <main id="detail">
      <div id="detailHead"></div>
      <div id="tabs"></div>
      <div id="content"></div>
    </main>
  </div>

  <div id="console"></div>

  <dialog id="newDialog">
    <div class="dlg-title">Nuovo sito</div>
    <label>Slug <span class="hint">— dominio: <span id="slugPreview">&lt;slug&gt;</span>.localhost</span></label>
    <input id="fSlug" placeholder="es. barber-bronx" autocomplete="off" spellcheck="false">
    <label>Titolo</label>
    <input id="fTitle" placeholder="(= slug se vuoto)">
    <label>Blueprint</label>
    <select id="fBlueprint"><option value="">— nessuno (WP pulito) —</option></select>
    <label>Lingua</label>
    <select id="fLocale"><option value="it_IT">it_IT</option><option value="en_US">en_US</option></select>
    <div class="dlg-actions">
      <button id="fCancel" class="ghost">Annulla</button>
      <button id="fCreate" class="primary">Crea sito</button>
    </div>
  </dialog>

  <div class="toast" id="toast"></div>
  <script src="renderer.js"></script>
</body>
</html>
