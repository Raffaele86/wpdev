<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>wpdev</title>
<style>
  :root {
    --bg: #16161d; --panel: #1e1e28; --panel2: #26263a;
    --text: #e8e8f0; --muted: #9a9ab0; --line: #32324a;
    --accent: #51bb7b; --accent2: #7aa2f7; --danger: #f7768e; --warn: #e0af68;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font: 13px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

  /* sidebar */
  #sidebar { width: 230px; min-width: 230px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #brand { padding: 14px 16px; font-weight: 700; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
  #brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  #siteList { flex: 1; overflow-y: auto; padding: 6px; }
  .siteItem { padding: 9px 10px; border-radius: 7px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .siteItem:hover { background: var(--panel2); }
  .siteItem.sel { background: var(--panel2); outline: 1px solid var(--line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--accent); } .dot.err { background: var(--danger); }
  #newBtn { margin: 10px; }

  /* main */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; min-height: 56px; }
  #siteTitle { font-size: 17px; font-weight: 650; margin-right: auto; }
  #tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 12px; }
  .tab { padding: 9px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.sel { color: var(--text); border-bottom-color: var(--accent); }
  #content { flex: 1; overflow-y: auto; padding: 18px; }

  /* console operazioni */
  #console { height: 150px; border-top: 1px solid var(--line); background: #101016; font: 12px/1.6 ui-monospace, monospace; overflow-y: auto; padding: 8px 12px; white-space: pre-wrap; display: none; }

  /* componenti */
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 7px 13px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1610; font-weight: 650; }
  button.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  a { color: var(--accent2); text-decoration: none; cursor: pointer; }
  table.kv { border-collapse: collapse; width: 100%; max-width: 720px; }
  table.kv td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.kv td:first-child { color: var(--muted); width: 150px; white-space: nowrap; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; max-width: 760px; }
  .card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  code { background: var(--panel2); padding: 2px 6px; border-radius: 5px; font: 12px ui-monospace, monospace; }
  pre.log { background: #101016; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 11.5px/1.5 ui-monospace, monospace; overflow: auto; max-height: 320px; margin-bottom: 14px; }
  .empty { color: var(--muted); padding: 60px 20px; text-align: center; }
  iframe#mailpit { width: 100%; height: calc(100vh - 210px); border: 1px solid var(--line); border-radius: 8px; background: #fff; }

  /* dialog nuovo sito */
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 22px; width: 420px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog label { display: block; margin: 12px 0 4px; color: var(--muted); }
  dialog input, dialog select { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font: inherit; }
  .toast { position: fixed; bottom: 165px; right: 20px; background: var(--panel2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 9px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div id="sidebar">
    <div id="brand">wpdev<small>WordPress locale</small></div>
    <div id="siteList"></div>
    <button id="newBtn" class="primary">＋ Nuovo sito</button>
  </div>
  <div id="main">
    <div id="topbar"><div id="siteTitle">—</div><div id="topActions"></div></div>
    <div id="tabs"></div>
    <div id="content"><div class="empty">Seleziona un sito o creane uno nuovo.</div></div>
    <div id="console"></div>
  </div>

  <dialog id="newDialog">
    <h3 style="margin-bottom:4px">Nuovo sito</h3>
    <label>Slug (dominio: <span id="slugPreview">&lt;slug&gt;</span>.localhost)</label>
    <input id="fSlug" placeholder="es. barber-bronx" autocomplete="off">
    <label>Titolo</label>
    <input id="fTitle" placeholder="(= slug se vuoto)">
    <label>Blueprint</label>
    <select id="fBlueprint"><option value="">— nessuno (WP pulito) —</option></select>
    <label>Lingua</label>
    <select id="fLocale"><option value="it_IT">it_IT</option><option value="en_US">en_US</option></select>
    <div class="row" style="justify-content:flex-end; margin-top:18px">
      <button id="fCancel">Annulla</button>
      <button id="fCreate" class="primary">Crea sito</button>
    </div>
  </dialog>

  <div class="toast" id="toast"></div>
  <script src="renderer.js"></script>
</body>
</html>
